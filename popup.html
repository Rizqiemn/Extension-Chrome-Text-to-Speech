<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickSpeak TTS</title>
<style>
body{font-family:Arial,sans-serif;width:330px;margin:0;padding:18px;background:#f8fafc;color:#111827}
h2{margin:0 0 4px;font-size:20px}.sub{font-size:12px;color:#64748b;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}
select,input{width:100%;box-sizing:border-box}
select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:white}
input[type=range]{accent-color:#2563eb}
.row{display:flex;justify-content:space-between;font-size:12px;color:#475569}
button{margin-top:15px;width:100%;padding:10px;border:0;border-radius:8px;background:#111827;color:white;font-weight:700;cursor:pointer}
#status{font-size:11px;color:#16a34a;margin-top:9px;min-height:14px}
</style>
</head>
<body>
<h2>🔊 QuickSpeak TTS</h2>
<div class="sub">Blok teks di halaman → klik ikon speaker.</div>

<label for="voice">Suara</label>
<select id="voice"><option>Memuat suara...</option></select>

<label>Kecepatan <span id="rateVal"></span></label>
<input id="rate" type="range" min="0.5" max="2" step="0.05">

<label>Pitch <span id="pitchVal"></span></label>
<input id="pitch" type="range" min="0.5" max="2" step="0.05">

<label>Volume <span id="volumeVal"></span></label>
<input id="volume" type="range" min="0" max="1" step="0.05">

<button id="test">▶ Tes suara</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
